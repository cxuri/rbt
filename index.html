<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Appu - S8 EEE Navigation</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --accent: #10b981;
            --danger: #ef4444;
            --bg-dark: #070B14;
            --surface: #131B2F;
            --surface-elevated: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
            color: var(--text-main); 
            height: 100vh; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- Header --- */
        .header { 
            padding: 20px; 
            text-align: center; 
            border-bottom: 1px solid var(--border); 
            background: rgba(7, 11, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow-sm);
            pointer-events: none;
        }
        
        .header h2, .header .status-pill, .header .robot-icon {
            pointer-events: auto;
        }

        .robot-icon { font-size: 2.2rem; display: block; margin-bottom: 4px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .status-pill { 
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; 
            border-radius: 30px; font-size: 0.7rem; font-weight: 700; background: var(--surface); 
            margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; transition: all 0.3s ease; }
        .online { color: var(--accent); border-color: rgba(16, 185, 129, 0.2); background: rgba(16, 185, 129, 0.05); }
        .online .status-dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .offline { color: var(--text-muted); }
        .offline .status-dot { background: var(--danger); }

        /* --- Chat Main --- */
        .main-view { 
            flex: 1; overflow-y: auto; padding: 25px 20px; 
            display: flex; flex-direction: column; scroll-behavior: smooth;
        }
        .chat-container { display: flex; flex-direction: column; gap: 20px; max-width: 768px; margin: 0 auto; width: 100%; padding-bottom: 10px; }
        
        .message { 
            max-width: 85%; padding: 14px 20px; border-radius: 24px; line-height: 1.5; 
            font-size: 1rem; animation: slideIn 0.3s forwards;
            box-shadow: var(--shadow-sm); word-wrap: break-word;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .ai { align-self: flex-start; background: var(--surface-elevated); border: 1px solid var(--border); border-bottom-left-radius: 6px; color: var(--text-main); }
        .user { align-self: flex-end; background: var(--primary-gradient); color: white; border-bottom-right-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }

        /* --- Footer & Controls --- */
        .footer { 
            padding: 15px 20px 25px 20px; background: rgba(7, 11, 20, 0.85); border-top: 1px solid var(--border);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .controls-wrapper { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        
        .quick-nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .quick-nav::-webkit-scrollbar { display: none; }
        
        .nav-pill { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .nav-pill:active { transform: scale(0.95); }
        .nav-pill:hover { background: var(--surface-elevated); border-color: rgba(255,255,255,0.2); }

        .main-actions { display: flex; gap: 12px; width: 100%; align-items: center; }
        
        .btn-icon { width: 60px; height: 60px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: white; font-size: 1.4rem; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; }
        .btn-icon:active { transform: scale(0.95); background: var(--surface-elevated); }

        .btn-mic { flex: 1; height: 60px; border-radius: 20px; border: none; background: var(--primary-gradient); color: white; font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .btn-mic:active { transform: scale(0.98); }
        .btn-mic.listening { background: var(--danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .input-bar { display: none; gap: 10px; margin-top: 5px; }
        .input-bar.active { display: flex; }

        input#userInput { flex: 1; padding: 0 20px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text-main); outline: none; font-size: 1rem; transition: border-color 0.3s; height: 55px; }
        input#userInput:focus { border-color: var(--primary); background: var(--surface-elevated); }

        .btn-send { width: 55px; height: 55px; border-radius: 18px; border: none; background: var(--primary-gradient); color: white; font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn-send:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="header">
        <span class="robot-icon">🤖</span>
        <h2>Appu Navigator</h2>
        <div id="btStatus" class="status-pill offline">
            <span class="status-dot"></span> <span id="btText">Robot Disconnected</span>
        </div>
    </div>

    <div class="main-view" id="mainView">
        <div id="chatSection" class="chat-container">
            <div class="message ai">Hello! I am <b>Appu</b>, your local S8 EEE Assistant. Connect 📡 <b>Bluetooth</b> to begin navigating!</div>
        </div>
    </div>

    <div class="footer">
        <div class="controls-wrapper">
            
            <div class="quick-nav">
                <button class="nav-pill" onclick="handleButtonCmd('Lift', 'L')"><span>🛗</span> Lift</button>
                <button class="nav-pill" onclick="handleButtonCmd('Office', 'F')"><span>🏢</span> Office</button>
                <button class="nav-pill" onclick="handleButtonCmd('Principal', 'R')"><span>👨‍🏫</span> Principal</button>
                <button class="nav-pill" onclick="handleButtonCmd('Admissions', 'B')"><span>📝</span> Admissions</button>
                <button class="nav-pill" onclick="handleButtonCmd('Stop', 'S')"><span>🛑</span> Stop</button>
            </div>

            <div class="main-actions">
                <button class="btn-icon" onclick="connectRobot()" title="Connect Bluetooth">📡</button>
                <button class="btn-mic" id="micBtn" onclick="toggleMic()">
                    <span id="micIcon" style="font-size: 1.2rem;">🎤</span> <span id="micLabel">Tap to Speak</span>
                </button>
                <button class="btn-icon" onclick="toggleKeyboard()" title="Type Message">⌨️</button>
            </div>
            
            <div class="input-bar" id="inputBar">
                <input type="text" id="userInput" placeholder="Type a destination..." onkeypress="if(event.key==='Enter') processInput(this.value)">
                <button class="btn-send" onclick="processInput(document.getElementById('userInput').value)">📤</button>
            </div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let bleChar;
        let isListening = false;
        let recognition;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function toggleKeyboard() {
            const bar = document.getElementById('inputBar');
            bar.classList.toggle('active');
            if(bar.classList.contains('active')) {
                setTimeout(() => document.getElementById('userInput').focus(), 100);
            }
        }

        async function connectRobot() {
            if (!window.isSecureContext) {
                addMessage("⚠️ Bluetooth requires an HTTPS connection. Host this on GitHub Pages.", false);
                return;
            }

            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                document.getElementById('btStatus').className = "status-pill online";
                document.getElementById('btText').innerText = "Robot Connected";
                addMessage("Hardware synced. Awaiting navigation commands.", false);
            } catch (e) { 
                console.error(e); 
                if(e.name !== "NotFoundError") {
                    addMessage("Bluetooth connection failed: " + e.message, false);
                }
            }
        }

        function sendCmd(char) {
            if(bleChar) bleChar.writeValue(new TextEncoder().encode(char));
            console.log("Hardware Command Sent: " + char);
        }

        // --- Local Navigation Logic ---
        
        function handleButtonCmd(locationName, cmdChar) {
            addMessage(`Take me to the ${locationName}`, true);
            executeNavigation(locationName, cmdChar);
        }

        function executeNavigation(locationName, cmdChar) {
            sendCmd(cmdChar);
            if (cmdChar === 'S') {
                addMessage("Stopping.", false);
            } else {
                addMessage(`Going to the ${locationName}.`, false);
            }
        }

        // Basic parser for typed/spoken text
        function processInput(text) {
            if (!text.trim()) return;
            
            addMessage(text, true);
            document.getElementById('userInput').value = '';
            document.getElementById('inputBar').classList.remove('active');
            scrollToBottom();

            const lowerText = text.toLowerCase();
            
            // Simple keyword matching
            if (lowerText.includes('lift')) {
                executeNavigation('Lift', 'L');
            } 
            else if (lowerText.includes('office')) {
                executeNavigation('Office', 'F');
            } 
            else if (lowerText.includes('principal')) {
                executeNavigation('Principal', 'R');
            } 
            else if (lowerText.includes('admission')) {
                executeNavigation('Admissions', 'B');
            } 
            else if (lowerText.includes('stop')) {
                executeNavigation('Stop', 'S');
            } 
            else {
                addMessage("I didn't recognize that destination. Please specify Lift, Office, Principal, Admissions, or Stop.", false);
            }
        }

        // --- UI & Utilities ---

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'ai'}`;
            div.innerHTML = text;
            document.getElementById('chatSection').appendChild(div);
            scrollToBottom();
            if(!isUser) speak(text);
        }

        function scrollToBottom() {
            const view = document.getElementById('mainView');
            view.scrollTop = view.scrollHeight;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-IN';
            u.rate = 0.95;
            u.pitch = 1.0;
            window.speechSynthesis.speak(u);
        }

        function toggleMic() {
            if (!window.isSecureContext) {
                alert("Mobile Warning: The Microphone requires an HTTPS connection to work.");
                return;
            }
            if (!SpeechRecognition) {
                alert("Speech Recognition is not supported in this browser.");
                return;
            }

            const btn = document.getElementById('micBtn');
            const label = document.getElementById('micLabel');

            if (isListening) {
                if (recognition) recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-IN'; 
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                btn.classList.add('listening');
                label.innerText = "Listening...";
                window.speechSynthesis.cancel(); 
            };

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                processInput(transcript); 
            };

            recognition.onerror = (event) => {
                console.error("Speech Error:", event.error);
                isListening = false;
                btn.classList.remove('listening');
                label.innerText = "Tap to Speak";
            };

            recognition.onend = () => {
                isListening = false;
                btn.classList.remove('listening');
                label.innerText = "Tap to Speak";
            };

            try {
                recognition.start();
            } catch (e) {
                console.error("Mic start error:", e);
            }
        }
    </script>
</body>
</html>
