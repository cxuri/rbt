<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubuntu Terminal Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* OS Desktop Background */
        body {
            background-color: #1e1e1e; 
            background-image: url('https://assets.ubuntu.com/v1/a2cb06f2-ubuntu-22.04-wallpaper-1.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: row; /* Side-by-side layout */
            justify-content: center;
            align-items: center;
            gap: 40px; /* Space between config panel and terminal */
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* --- Config Panel Styles --- */
        #config-panel {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            padding: 20px;
            width: 300px;
            height: 500px; /* Slightly increased to fit the new option */
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            color: #d3d7cf;
        }

        #config-panel h3 {
            margin-top: 0;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
        }
        
        .config-label {
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
            font-weight: bold;
        }

        /* New Path Input Style */
        #custom-path {
            background-color: #111;
            color: #729fcf;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 8px;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        #custom-output {
            flex-grow: 1;
            background-color: #111;
            color: #8ae234; /* Green text to look cool */
            border: 1px solid #555;
            border-radius: 5px;
            padding: 10px;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            white-space: pre;
        }

        /* --- Terminal Styles --- */
        #window {
            width: 800px;
            height: 500px;
            background-color: #300A24;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 14px 28px rgba(0,0,0,0.5), 0 10px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #title-bar {
            background-color: #2b2b2b;
            color: #d3d7cf;
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-family: 'Ubuntu', sans-serif;
            font-size: 14px;
            user-select: none;
            border-bottom: 1px solid #111;
        }

        .title-text {
            flex-grow: 1;
            text-align: center;
            font-weight: bold;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }
        .btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .btn-close { background-color: #ef492d; }
        .btn-min { background-color: #d1d1d1; }
        .btn-max { background-color: #d1d1d1; }

        #terminal {
            background-color: #300A24; 
            color: #ffffff;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 16px;
            padding: 4px 8px;
            flex-grow: 1;
            overflow-y: auto;
            cursor: text;
        }

        .user { color: #8ae234; font-weight: bold; } 
        .path { color: #729fcf; font-weight: bold; } 
        
        #input-line {
            display: flex;
            align-items: center;
        }

        .prompt {
            white-space: pre;
        }

        #cmd {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
            margin-left: 6px;
            caret-color: #ffffff; 
        }
    </style>
</head>
<body>

    <div id="config-panel">
        <h3>⚙️ Simulator Config</h3>
        
        <label class="config-label" for="custom-path">Current Folder (Path):</label>
        <input type="text" id="custom-path" value="~/Documents/OS_Project" spellcheck="false">

        <label class="config-label" for="custom-output">./a.out Output:</label>
        <textarea id="custom-output" spellcheck="false">Parent Process:
   Parent PID: 3412
   Child PID: 3413
Child Process:
   Child PID: 3413
   Parent PID: 3412</textarea>
    </div>

    <div id="window">
        <div id="title-bar">
            <div style="width: 50px;"></div>
            <div class="title-text" id="window-title">student@student-Optiplex-3050: ~/Documents/OS_Project</div>
            <div class="window-controls">
                <span class="btn btn-min"></span>
                <span class="btn btn-max"></span>
                <span class="btn btn-close"></span>
            </div>
        </div>

        <div id="terminal">
            <div id="output"></div>
            <div id="input-line">
                <span class="prompt"><span class="user">student@student-Optiplex-3050</span>:<span class="path" id="current-path">~/Documents/OS_Project</span>$</span>
                <input type="text" id="cmd" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('cmd');
        const output = document.getElementById('output');
        const terminal = document.getElementById('terminal');
        const customOutputBox = document.getElementById('custom-output');
        
        // New elements for the dynamic path
        const pathInput = document.getElementById('custom-path');
        const currentPathDisplay = document.getElementById('current-path');
        const windowTitle = document.getElementById('window-title');

        // Update the prompt and window title live when the user types in the config panel
        pathInput.addEventListener('input', function() {
            const newPath = pathInput.value || '~'; // Default to ~ if they delete everything
            currentPathDisplay.textContent = newPath;
            windowTitle.textContent = `student@student-Optiplex-3050: ${newPath}`;
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = input.value.trim();
                
                // Dynamically build the prompt HTML so it captures the CURRENT path
                const currentPath = pathInput.value || '~';
                const dynamicPromptHTML = `<span class="prompt"><span class="user">student@student-Optiplex-3050</span>:<span class="path">${currentPath}</span>$</span> `;
                
                output.innerHTML += `<div style="margin-top: 2px;">${dynamicPromptHTML}${command}</div>`;

                if (command === './a.out') {
                    const dynamicContent = customOutputBox.value;
                    const formattedContent = dynamicContent
                        .replace(/\n/g, '<br>')
                        .replace(/ /g, '&nbsp;');
                        
                    output.innerHTML += `<div>${formattedContent}</div>`;
                } else if (command === 'clear') {
                    output.innerHTML = '';
                } else if (command !== '') {
                    output.innerHTML += `<div>${command}: command not found</div>`;
                }

                input.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        terminal.addEventListener('click', function() {
            input.focus();
        });
    </script>
</body>
</html>
