<!DOCTYPE html>
<html>
<head>
    <title>Bot Tester</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; }
        .controls { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 50px; }
        button { width: 100px; height: 100px; border-radius: 15px; border: none; background: #444; color: white; font-size: 20px; }
        button:active { background: #6366f1; }
        .conn-btn { width: 320px; height: 50px; margin-top: 20px; background: #10b981; }
    </style>
</head>
<body>
    <h2>6-Wheel Tank Control</h2>
    <div id="status">Status: Disconnected</div>
    
    <div class="controls">
        <button onclick="send('PIVOT_L,500')">Pivot L</button>
        <button onclick="send('FORWARD,1000')">Forward</button>
        <button onclick="send('PIVOT_R,500')">Pivot R</button>
        <button onclick="send('LEFT,1000')">Skid L</button>
        <button onclick="send('STOP,0')" style="background:#ef4444">STOP</button>
        <button onclick="send('RIGHT,1000')">Skid R</button>
        <div></div>
        <button onclick="send('BACK,1000')">Back</button>
    </div>

    <button class="conn-btn" onclick="connect()">CONNECT TO BOT</button>

    <script>
        let botChar;
        const S_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const C_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        async function connect() {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: '6Wheel_Tank_Bot' }],
                optionalServices: [S_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(S_UUID);
            botChar = await service.getCharacteristic(C_UUID);
            document.getElementById('status').innerText = "Status: Connected!";
        }

        async function send(msg) {
            if(!botChar) return alert("Connect first!");
            await botChar.writeValue(new TextEncoder().encode(msg + "\n"));
        }
    </script>
</body>
</html>
