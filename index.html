<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Appu - S8 EEE Navigation</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --accent: #10b981;
            --danger: #ef4444;
            --bg-dark: #070B14;
            --surface: #131B2F;
            --surface-elevated: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
            color: var(--text-main); 
            height: 100vh; 
            height: 100dvh; /* For modern mobile browsers */
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- Header --- */
        .header { 
            padding: 20px; 
            text-align: center; 
            border-bottom: 1px solid var(--border); 
            background: rgba(7, 11, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        
        .robot-icon { font-size: 2.2rem; display: block; margin-bottom: 4px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .header h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }

        .status-pill { 
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; 
            border-radius: 30px; font-size: 0.7rem; font-weight: 700; background: var(--surface); 
            margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; transition: all 0.3s ease; }
        .online { color: var(--accent); border-color: rgba(16, 185, 129, 0.2); background: rgba(16, 185, 129, 0.05); }
        .online .status-dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .offline { color: var(--text-muted); }
        .offline .status-dot { background: var(--danger); }

        .settings-icon { 
            position: absolute; right: 20px; top: 25px; cursor: pointer; font-size: 1.3rem; 
            color: var(--text-muted); transition: 0.3s; padding: 5px; border-radius: 50%;
        }
        .settings-icon:hover { color: var(--text-main); transform: rotate(45deg); background: var(--surface); }

        /* --- Chat Main --- */
        .main-view { 
            flex: 1; overflow-y: auto; padding: 25px 20px; 
            display: flex; flex-direction: column; scroll-behavior: smooth;
        }
        .chat-container { display: flex; flex-direction: column; gap: 20px; max-width: 768px; margin: 0 auto; width: 100%; padding-bottom: 10px; }
        
        .message { 
            max-width: 85%; padding: 14px 20px; border-radius: 24px; line-height: 1.5; 
            font-size: 1rem; animation: slideIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            box-shadow: var(--shadow-sm);
            word-wrap: break-word;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .ai { 
            align-self: flex-start; background: var(--surface-elevated); border: 1px solid var(--border); 
            border-bottom-left-radius: 6px; color: var(--text-main);
        }
        .user { 
            align-self: flex-end; background: var(--primary-gradient); color: white; 
            border-bottom-right-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
        }

        /* Typing Indicator */
        .typing { display: none; align-self: flex-start; padding: 14px 22px; background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 24px; border-bottom-left-radius: 6px; gap: 6px; margin-bottom: 10px; }
        .dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        /* --- Footer & Controls --- */
        .footer { 
            padding: 15px 20px 25px 20px; background: rgba(7, 11, 20, 0.85); border-top: 1px solid var(--border);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .controls-wrapper { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        
        /* Quick Nav Buttons */
        .quick-nav {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; 
            -webkit-overflow-scrolling: touch;
        }
        .quick-nav::-webkit-scrollbar { display: none; }
        
        .nav-pill {
            background: var(--surface); border: 1px solid var(--border); color: var(--text-main);
            padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
        }
        .nav-pill:active { transform: scale(0.95); }
        .nav-pill:hover { background: var(--surface-elevated); border-color: rgba(255,255,255,0.2); }

        .main-actions { display: flex; gap: 12px; width: 100%; align-items: center; }
        
        .btn-icon { 
            width: 60px; height: 60px; border-radius: 20px; border: 1px solid var(--border); 
            background: var(--surface); color: white; font-size: 1.4rem; cursor: pointer; 
            transition: all 0.2s ease; display: flex; justify-content: center; align-items: center;
        }
        .btn-icon:active { transform: scale(0.95); background: var(--surface-elevated); }

        .btn-mic { 
            flex: 1; height: 60px; border-radius: 20px; border: none; background: var(--primary-gradient); 
            color: white; font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; 
            justify-content: center; gap: 10px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-mic:active { transform: scale(0.98); }
        .btn-mic.listening { 
            background: var(--danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); 
            animation: pulse-red 1.5s infinite; 
        }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* Text Input Bar */
        .input-bar { display: none; gap: 10px; animation: slideUp 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); margin-top: 5px; }
        .input-bar.active { display: flex; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input#userInput { 
            flex: 1; padding: 0 20px; border-radius: 18px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-main); outline: none; font-size: 1rem;
            transition: border-color 0.3s; height: 55px;
        }
        input#userInput:focus { border-color: var(--primary); background: var(--surface-elevated); }

        .btn-send {
            width: 55px; height: 55px; border-radius: 18px; border: none; background: var(--primary-gradient);
            color: white; font-size: 1.2rem; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-send:active { transform: scale(0.95); }

        /* --- Modal --- */
        #settingsModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            z-index: 100; align-items: center; justify-content: center; padding: 20px; 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            animation: fadeIn 0.2s ease;
        }
        .modal-content { 
            background: var(--surface-elevated); padding: 35px 25px; border-radius: 28px; 
            width: 100%; max-width: 380px; border: 1px solid var(--border); text-align: center;
            box-shadow: var(--shadow-lg);
        }
        .modal-content h3 { margin-bottom: 20px; font-weight: 600; }
        .modal-content input { 
            width: 100%; padding: 16px; margin-bottom: 20px; border-radius: 16px; 
            border: 1px solid var(--border); background: var(--bg-dark); color: white; outline: none;
            font-size: 0.95rem; transition: border 0.3s;
        }
        .modal-content input:focus { border-color: var(--primary); }
        .btn-modal { padding: 16px; border-radius: 16px; border: none; width: 100%; font-weight: 600; font-size: 1rem; cursor: pointer; margin-bottom: 12px; transition: 0.2s; }
        .save { background: var(--primary-gradient); color: white; }
        .save:active { transform: scale(0.98); }
        .close { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .close:active { background: var(--surface); }

        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
    </style>
</head>
<body>

    <div id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ Appu Configuration</h3>
            <input type="password" id="keyInput" placeholder="Enter Gemini API Key...">
            <button class="btn-modal save" onclick="saveKey()">Save & Initialize</button>
            <button class="btn-modal close" onclick="toggleSettings()">Cancel</button>
            <p id="keyStatus" style="font-size: 0.75rem; margin-top: 10px; font-weight: 600;"></p>
        </div>
    </div>

    <div class="header">
        <span class="settings-icon" onclick="toggleSettings()" title="Settings">⚙️</span>
        <span class="robot-icon">🤖</span>
        <h2>Appu Navigator</h2>
        <div id="btStatus" class="status-pill offline">
            <span class="status-dot"></span> <span id="btText">Robot Disconnected</span>
        </div>
    </div>

    <div class="main-view" id="mainView">
        <div id="chatSection" class="chat-container">
            <div class="message ai">Hello! I am <b>Appu</b>, your S8 EEE Assistant. Connect 📡 <b>Bluetooth</b> to begin navigating!</div>
        </div>
        <div class="typing" id="typingIndicator">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <div class="footer">
        <div class="controls-wrapper">
            
            <div class="quick-nav">
                <button class="nav-pill" onclick="processAI('Take me to the Lift')"><span>🛗</span> Lift</button>
                <button class="nav-pill" onclick="processAI('Navigate to the Office')"><span>🏢</span> Office</button>
                <button class="nav-pill" onclick="processAI('Take me to the Principal')"><span>👨‍🏫</span> Principal</button>
                <button class="nav-pill" onclick="processAI('Where is Admissions?')"><span>📝</span> Admissions</button>
                <button class="nav-pill" onclick="processAI('Stop moving immediately')"><span>🛑</span> Stop</button>
            </div>

            <div class="main-actions">
                <button class="btn-icon" onclick="connectRobot()" title="Connect Bluetooth">📡</button>
                <button class="btn-mic" id="micBtn" onclick="toggleMic()">
                    <span id="micIcon" style="font-size: 1.2rem;">🎤</span> <span id="micLabel">Tap to Speak</span>
                </button>
                <button class="btn-icon" onclick="toggleKeyboard()" title="Type Message">⌨️</button>
            </div>
            
            <div class="input-bar" id="inputBar">
                <input type="text" id="userInput" placeholder="Type a destination or command..." onkeypress="if(event.key==='Enter') processAI(this.value)">
                <button class="btn-send" onclick="processAI(document.getElementById('userInput').value)">📤</button>
            </div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let bleChar;
        let isListening = false;
        let recognition;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        // Configuration
        function toggleSettings() {
            const m = document.getElementById('settingsModal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
            if(m.style.display === 'flex') {
                const existingKey = localStorage.getItem('gemini_key');
                if(existingKey) document.getElementById('keyInput').value = existingKey;
            }
            updateKeyStatus();
        }

        function saveKey() {
            const key = document.getElementById('keyInput').value.trim();
            if(key) { 
                localStorage.setItem('gemini_key', key); 
                toggleSettings(); 
                addMessage("API key configured successfully.", false);
            }
        }

        function updateKeyStatus() {
            const key = localStorage.getItem('gemini_key');
            const s = document.getElementById('keyStatus');
            s.innerText = key ? "✅ API KEY LOADED" : "❌ KEY MISSING";
            s.style.color = key ? "var(--accent)" : "var(--danger)";
        }

        function toggleKeyboard() {
            const bar = document.getElementById('inputBar');
            bar.classList.toggle('active');
            if(bar.classList.contains('active')) {
                setTimeout(() => document.getElementById('userInput').focus(), 100);
            }
        }

        // Bluetooth
        async function connectRobot() {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                document.getElementById('btStatus').className = "status-pill online";
                document.getElementById('btText').innerText = "Robot Connected";
                addMessage("Hardware synced. Awaiting navigation commands.", false);
            } catch (e) { 
                console.error(e); 
                if(e.name !== "NotFoundError") {
                    addMessage("Bluetooth connection failed. Ensure the ESP32 is powered on and paired.", false);
                }
            }
        }

        function sendCmd(char) {
            if(bleChar) bleChar.writeValue(new TextEncoder().encode(char));
            console.log("Hardware Command Sent: " + char);
        }

        // AI Logic
        async function processAI(msg) {
            if (!msg.trim()) return;
            const API_KEY = localStorage.getItem('gemini_key');
            if (!API_KEY) return toggleSettings();

            // UI Feedback
            addMessage(msg, true);
            document.getElementById('userInput').value = '';
            document.getElementById('inputBar').classList.remove('active');
            
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'flex';
            scrollToBottom();

            // The Comprehensive System Prompt
            const prompt = `
                Identity: You are "Appu", an autonomous indoor navigation robot.
                Creators: Designed and developed by S8 EEE students for a campus project.
                Hardware: You run on an ESP32, using a 6-wheel tank-style chassis with skid-steering, GY-87 10DOF IMU, and ultrasonic sensors.

                Available Hardware Commands: [MOVE_F], [MOVE_B], [MOVE_L], [MOVE_R], [MOVE_S].
                Instructions: Be professional, friendly, and concise. If the user asks you to move to a location, determine the best direction and ALWAYS include the exact bracketed command in your text. For example, "Moving forward to the office. [MOVE_F]". If they ask you to stop, output "[MOVE_S]".
            `;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        system_instruction: { parts: [{ text: prompt }] }, 
                        contents: [{ parts: [{ text: msg }] }] 
                    })
                });
                
                const data = await res.json();
                
                if (!data.candidates || !data.candidates[0].content.parts[0].text) {
                    throw new Error("Invalid Response from AI");
                }

                const aiText = data.candidates[0].content.parts[0].text;

                // Execute Hardware Commands via Bluetooth
                if (aiText.includes("MOVE_F")) sendCmd('F');
                if (aiText.includes("MOVE_B")) sendCmd('B');
                if (aiText.includes("MOVE_L")) sendCmd('L');
                if (aiText.includes("MOVE_R")) sendCmd('R');
                if (aiText.includes("MOVE_S")) sendCmd('S');

                // Hide indicator and clean text for the UI
                indicator.style.display = 'none';
                const cleanText = aiText.replace(/\[MOVE_[FBRLS]\]/g, '').trim();
                addMessage(cleanText, false);

            } catch (e) { 
                console.error(e);
                indicator.style.display = 'none';
                addMessage("I am having trouble connecting to my cloud brain. Please verify your API key and internet connection.", false); 
            }
        }

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'ai'}`;
            // Use innerHTML to allow basic bolding (<b>) from the AI
            div.innerHTML = text;
            document.getElementById('chatSection').appendChild(div);
            scrollToBottom();
            if(!isUser) speak(text);
        }

        function scrollToBottom() {
            const view = document.getElementById('mainView');
            view.scrollTop = view.scrollHeight;
        }

        // Voice Engine
        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-IN';
            u.rate = 0.95;
            u.pitch = 1.0;
            window.speechSynthesis.speak(u);
        }

        // Mic Logic
        function toggleMic() {
            if (!SpeechRecognition) {
                alert("Speech Recognition is not supported in this browser. Please use Google Chrome.");
                return;
            }

            const btn = document.getElementById('micBtn');
            const label = document.getElementById('micLabel');

            if (isListening) {
                if (recognition) recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-IN'; 
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                btn.classList.add('listening');
                label.innerText = "Listening...";
                window.speechSynthesis.cancel(); 
            };

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                processAI(transcript); 
            };

            recognition.onerror = (event) => {
                console.error("Speech Error:", event.error);
                isListening = false;
                btn.classList.remove('listening');
                label.innerText = "Tap to Speak";
                
                if (event.error === 'not-allowed') {
                    alert("Microphone access denied. Please allow microphone permissions in your browser settings.");
                } else if (event.error === 'network' || window.location.protocol === 'file:') {
                    alert("Microphone requires a secure connection. Run this file via a local server (localhost) or HTTPS.");
                }
            };

            recognition.onend = () => {
                isListening = false;
                btn.classList.remove('listening');
                label.innerText = "Tap to Speak";
            };

            try {
                recognition.start();
            } catch (e) {
                console.error("Mic start error:", e);
            }
        }
        window.onclick = function(event) {
            const modal = document.getElementById('settingsModal');
            if (event.target === modal && modal.style.display === 'flex') {
                toggleSettings();
            }
        };
        // Init
        updateKeyStatus();
    </script>
</body>
</html>
